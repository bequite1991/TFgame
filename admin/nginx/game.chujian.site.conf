# 《高塔防线》管理端 — nginx 留档（game.chujian.site）
# 服务器实际路径：/etc/nginx/sites-available/game.chujian.site
# 证书由 certbot --nginx 签发并自动改写本配置（HTTP 301 → HTTPS）

server {
    server_name game.chujian.site;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/game.chujian.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/game.chujian.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = game.chujian.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name game.chujian.site;
    return 404; # managed by Certbot


}