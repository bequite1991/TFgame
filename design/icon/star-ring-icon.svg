<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#101B38"/>
      <stop offset="55%" stop-color="#0B1226"/>
      <stop offset="100%" stop-color="#070B18"/>
    </radialGradient>
    <linearGradient id="towerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16244A"/>
      <stop offset="100%" stop-color="#0C142C"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22E0FF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#22E0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22E0FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22E0FF"/>
      <stop offset="55%" stop-color="#7CEBFF"/>
      <stop offset="100%" stop-color="#FFC94D"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="45%" stop-color="#FFC94D"/>
      <stop offset="100%" stop-color="#B97A12"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bgGrad)"/>

  <!-- 战术网格 -->
  <g stroke="#22E0FF" stroke-opacity="0.055" stroke-width="2">
    <path d="M128 96V928M256 96V928M384 96V928M512 96V928M640 96V928M768 96V928M896 96V928"/>
    <path d="M96 128H928M96 256H928M96 384H928M96 512H928M96 640H928M96 768H928M96 896H928"/>
  </g>

  <!-- 星星 -->
  <g fill="#CFE9FF">
    <circle cx="180" cy="200" r="3.5" opacity="0.9"/>
    <circle cx="850" cy="150" r="3" opacity="0.7"/>
    <circle cx="760" cy="320" r="2.5" opacity="0.5"/>
    <circle cx="140" cy="560" r="2.5" opacity="0.55"/>
    <circle cx="905" cy="540" r="3" opacity="0.6"/>
    <circle cx="300" cy="120" r="2.5" opacity="0.6"/>
    <circle cx="620" cy="110" r="2" opacity="0.5"/>
    <circle cx="120" cy="820" r="3" opacity="0.5"/>
    <circle cx="880" cy="850" r="3.5" opacity="0.7"/>
  </g>
  <g fill="#22E0FF">
    <circle cx="240" cy="330" r="2" opacity="0.8"/>
    <circle cx="800" cy="700" r="2" opacity="0.7"/>
  </g>

  <!-- 星环（后半圈，压在塔后） -->
  <g transform="rotate(-14 512 600)">
    <ellipse cx="512" cy="600" rx="345" ry="118" fill="none" stroke="#22E0FF" stroke-opacity="0.14" stroke-width="26"/>
    <path d="M167 600 A345 118 0 0 1 857 600" fill="none" stroke="url(#ringGrad)" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
    <path d="M167 600 A345 118 0 0 1 857 600" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 防御塔 -->
  <g stroke-linejoin="round">
    <!-- 底座 -->
    <polygon points="348,788 676,788 640,706 384,706" fill="#0A1122" stroke="#0E7A9C" stroke-width="4"/>
    <polygon points="384,706 640,706 616,668 408,668" fill="url(#towerFill)" stroke="#22E0FF" stroke-width="4"/>
    <!-- 塔身下段 -->
    <polygon points="404,668 620,668 594,552 430,552" fill="url(#towerFill)" stroke="#22E0FF" stroke-width="5"/>
    <!-- 塔身上段 -->
    <polygon points="430,552 594,552 568,438 456,438" fill="url(#towerFill)" stroke="#22E0FF" stroke-width="5"/>
    <!-- 炮塔头 -->
    <polygon points="456,438 568,438 552,352 472,352" fill="url(#towerFill)" stroke="#22E0FF" stroke-width="5"/>
    <!-- 发射叉 -->
    <polygon points="472,352 500,352 494,292 480,292" fill="#101C3C" stroke="#22E0FF" stroke-width="4"/>
    <polygon points="524,352 552,352 544,292 530,292" fill="#101C3C" stroke="#22E0FF" stroke-width="4"/>
    <!-- 结构线 -->
    <path d="M448 626H576M462 500H562M476 400H548" stroke="#22E0FF" stroke-opacity="0.5" stroke-width="3" fill="none"/>
    <path d="M512 668V552M512 438V352" stroke="#22E0FF" stroke-opacity="0.35" stroke-width="3" fill="none"/>
    <!-- 金色能量核心 -->
    <circle cx="512" cy="610" r="34" fill="none" stroke="#FFC94D" stroke-opacity="0.35" stroke-width="10"/>
    <circle cx="512" cy="610" r="26" fill="url(#coreGrad)" stroke="#FFE9B8" stroke-width="3"/>
    <circle cx="512" cy="490" r="12" fill="#22E0FF" opacity="0.9"/>
    <circle cx="512" cy="490" r="22" fill="none" stroke="#22E0FF" stroke-opacity="0.4" stroke-width="6"/>
    <!-- 发射口宝石 -->
    <polygon points="512,258 536,290 512,322 488,290" fill="#BFFBFF" stroke="#22E0FF" stroke-width="4"/>
  </g>

  <!-- 光束 -->
  <polygon points="500,282 524,282 540,96 484,96" fill="url(#beamGrad)" opacity="0.85"/>
  <polygon points="508,282 516,282 524,110 500,110" fill="#E9FDFF" opacity="0.9"/>

  <!-- 星环（前半圈，压在塔前，形成环绕感） -->
  <g transform="rotate(-14 512 600)">
    <path d="M167 600 A345 118 0 0 0 857 600" fill="none" stroke="url(#ringGrad)" stroke-opacity="0.4" stroke-width="16" stroke-linecap="round"/>
    <path d="M167 600 A345 118 0 0 0 857 600" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 环上的入侵者（品红外星小队，沿环逼近） -->
  <g fill="#FF3D81">
    <polygon points="240,505 258,523 240,541 222,523"/>
    <polygon points="300,545 315,560 300,575 285,560" opacity="0.85"/>
    <polygon points="352,575 364,587 352,599 340,587" opacity="0.7"/>
  </g>
  <g fill="#FF3D81" opacity="0.35">
    <circle cx="240" cy="523" r="24"/>
    <circle cx="300" cy="560" r="18"/>
  </g>

  <!-- 底部地面光晕 -->
  <ellipse cx="512" cy="800" rx="220" ry="26" fill="#22E0FF" opacity="0.12"/>

  <!-- 内描边 -->
  <rect x="14" y="14" width="996" height="996" rx="208" fill="none" stroke="#22E0FF" stroke-opacity="0.25" stroke-width="3"/>
</svg>
